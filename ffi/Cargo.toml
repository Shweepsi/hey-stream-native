[package]
name = "heystream-ffi"
version.workspace = true
license.workspace = true
publish = false
edition = "2024"
description = "Liaisons UniFFI du cœur hey-stream pour Kotlin (Android) et Swift (Apple)"

[lib]
name = "heystream"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Générateur des liaisons (scripts/bindings.sh) : absent de la bibliothèque
# livrée dans les apps.
bindgen = ["uniffi/cli"]

[dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
uniffi = "0.32.2"
xtream-core = { path = "../core" }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
