[package]
name = "xtream-core"
version.workspace = true
license.workspace = true
publish = false
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
flate2 = "1.1.10"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"

# Android : racines de confiance embarquées (voir `client::android_roots`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.11"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
webpki-root-certs = "1.0.11"
wiremock = "0.6.5"
