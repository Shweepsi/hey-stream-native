[package]
name = "xtream-core"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "gzip"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
wiremock = "0.6.5"
