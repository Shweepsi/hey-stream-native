name: core

# Docs, site et modèles GitHub seuls ne relancent pas la CI du code.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - .github/workflows/release.yml

# Un nouveau push sur une PR annule la CI devenue inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  licences:
    name: licences tierces à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      # Binaire précompilé : pas de compilation de cargo-about à chaque fois.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      # Toute licence non listée dans about.toml fait échouer la génération.
      - run: scripts/third_party_licenses.sh
      - name: Liste à jour
        run: git diff --exit-code android/app/src/main/assets/licenses/rust.txt || { echo "Lancer scripts/third_party_licenses.sh et committer le résultat."; exit 1; }

