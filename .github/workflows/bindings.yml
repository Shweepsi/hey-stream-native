name: bindings

# Seulement quand l'interface du cœur change (macOS est lent à obtenir et
# coûteux). Le cœur lui-même est compilé par core et android à chaque PR.
on:
  push:
    branches: [main]
    paths: [ffi/**, scripts/bindings.sh, .github/workflows/bindings.yml]
  pull_request:
    paths: [ffi/**, scripts/bindings.sh, .github/workflows/bindings.yml]
  workflow_dispatch:

# Un nouveau push sur une PR annule la CI devenue inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: scripts/bindings.sh kotlin
      - run: gradle -p ffi/smoke/kotlin run --no-daemon

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/bindings.sh swift
      - name: Compiler et lancer le test Swift
        run: |
          swiftc -o smoke \
            -Xcc -fmodule-map-file=bindings/swift/HeyStreamCoreFFI.modulemap \
            -I bindings/swift \
            -L target/debug -lheystream \
            bindings/swift/HeyStreamCore.swift ffi/smoke/swift/main.swift
          DYLD_LIBRARY_PATH=target/debug ./smoke
