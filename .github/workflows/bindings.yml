name: bindings

# PR : seulement quand l'interface du cœur change (macOS est lent à obtenir
# et coûteux). main : à chaque push, car les tests Kotlin et Swift lancent
# aussi le cœur (et le compilent pour macOS) ; une casse venue de core/ ou
# de Cargo.lock y est vue aussitôt, et le cache reste chaud.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - .github/workflows/release.yml
  pull_request:
    paths: [ffi/**, scripts/bindings.sh, .github/workflows/bindings.yml]
  workflow_dispatch:

# Un nouveau push sur une PR annule la CI devenue inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: scripts/bindings.sh kotlin
      - run: gradle -p ffi/smoke/kotlin run --no-daemon

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: scripts/bindings.sh swift
      - name: Compiler et lancer le test Swift
        run: |
          swiftc -o smoke \
            -Xcc -fmodule-map-file=bindings/swift/HeyStreamCoreFFI.modulemap \
            -I bindings/swift \
            -L target/debug -lheystream \
            bindings/swift/HeyStreamCore.swift ffi/smoke/swift/main.swift
          DYLD_LIBRARY_PATH=target/debug ./smoke
