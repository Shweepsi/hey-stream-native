name: android

# Docs, site et modèles GitHub seuls ne relancent pas la CI du code.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - .github/workflows/release.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - site/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/pages.yml
      - .github/workflows/release.yml
  # À la main : Actions › android › Run workflow (lance aussi l'émulateur).
  workflow_dispatch:

# Un nouveau push sur une PR annule la CI devenue inutile.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Un seul job compile le cœur pour Android (Gradle appelle cargo ndk).
  # Cache cargo partagé avec la release (même clé).
  app:
    name: application (tests, APK de test, clippy Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Seul main écrit le cache : les PR le lisent sans le remplacer.
      - uses: ./.github/actions/android-rust
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy
          cache-key: android-arm
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      # Tests JVM (Robolectric) : logique et composition de chaque écran.
      - name: Tests et Android Lint
        working-directory: android
        run: ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug
      - name: APK (release, clé de test)
        working-directory: android
        # Clé des rapports de plantage (vide pour une PR venue d'un fork).
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: ./gradlew --console=plain :app:assembleRelease
      # Bibliothèque compilée par Gradle (cargo ndk … build --release).
      - name: Taille et alignement 16 Ko (Android 15+)
        run: |
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for target in aarch64-linux-android armv7-linux-androideabi; do
            lib="target/$target/release/libheystream.so"
            ls -l "$lib"
          done
          lib="target/aarch64-linux-android/release/libheystream.so"
          for align in $("$readelf" -lW "$lib" | awk '$1 == "LOAD" { print $NF }'); do
            if (( align < 16384 )); then
              echo "segment LOAD aligné sur $align octets au lieu de 16 Ko"; exit 1
            fi
          done
      - name: Taille de l'APK
        run: ls -l android/app/build/outputs/apk/release/app-release.apk
      - name: Version
        id: version
        run: echo "name=$(sed -nE 's/^version = "([0-9.]+)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: hey-stream-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # En dernier, et même si une étape d'avant échoue : un avertissement
      # clippy ne masque ni les tests ni l'APK, et inversement.
      # Le code propre à Android (racines TLS) n'est compilé que pour ces cibles.
      - name: Clippy (cibles Android)
        if: ${{ !cancelled() }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a --platform 30 clippy --workspace -- -D warnings

  # Le plus long : après chaque fusion dans main, ou à la main. La release
  # attend que tout ce workflow soit vert sur main (release.yml).
  emulator:
    name: émulateur (connexion, catalogue, direct)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-rust
        with:
          targets: x86_64-linux-android
          cache-key: android-x86
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cœur compilé pour l'émulateur seulement (x86_64).
      - name: APK de l'émulateur
        working-directory: android
        run: ./gradlew --console=plain -Pheystream.abis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      # Faux panneau local (MockWebServer) : aucun vrai fournisseur contacté.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # Sans profil, l'écran ne fait que 640 × 320 dp.
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # En cas d'échec : raison du test et fin du journal Android.
          script: cd android && ./gradlew --console=plain -Pheystream.abis=x86_64 :app:connectedDebugAndroidTest || { grep -h -A60 "<failure" app/build/outputs/androidTest-results/connected/debug/*.xml; adb logcat -d -t 400 | grep -E " (E|F) |AndroidRuntime|heystream"; exit 1; }
