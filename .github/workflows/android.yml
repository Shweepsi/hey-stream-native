name: android

on:
  push:
    branches: [main]
  pull_request:

env:
  NDK_VERSION: "28.2.13676358"

jobs:
  core:
    name: cœur (arm64-v8a, armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          components: clippy
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # Le code propre à Android (racines TLS) n'est compilé que pour ces cibles.
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a --platform 30 clippy --workspace -- -D warnings
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a --platform 30 build -p heystream-ffi --release
      - name: Taille et alignement 16 Ko (Android 15+)
        run: |
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for target in aarch64-linux-android armv7-linux-androideabi; do
            lib="target/$target/release/libheystream.so"
            ls -l "$lib"
          done
          lib="target/aarch64-linux-android/release/libheystream.so"
          for align in $("$readelf" -lW "$lib" | awk '$1 == "LOAD" { print $NF }'); do
            if (( align < 16384 )); then
              echo "segment LOAD aligné sur $align octets au lieu de 16 Ko"; exit 1
            fi
          done

  app:
    name: application (tests, APK de test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      # Tests JVM (Robolectric) : logique et composition de chaque écran.
      - name: Tests
        working-directory: android
        run: ./gradlew --console=plain :app:testDebugUnitTest
      - name: APK (release, clé de test)
        working-directory: android
        run: ./gradlew --console=plain :app:assembleRelease
      - name: Taille de l'APK
        run: ls -l android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hey-stream-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator:
    name: émulateur (connexion, catalogue, direct)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cœur compilé pour l'émulateur seulement (x86_64).
      - name: APK de l'émulateur
        working-directory: android
        run: ./gradlew --console=plain -Pheystream.abis=x86_64 :app:assembleDebug :app:assembleDebugAndroidTest
      # Faux panneau local (MockWebServer) : aucun vrai fournisseur contacté.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # En cas d'échec : raison du test et fin du journal Android.
          script: cd android && ./gradlew --console=plain -Pheystream.abis=x86_64 :app:connectedDebugAndroidTest || { grep -h -A60 "<failure" app/build/outputs/androidTest-results/connected/debug/*.xml; adb logcat -d -t 400 | grep -E " (E|F) |AndroidRuntime|heystream"; exit 1; }
