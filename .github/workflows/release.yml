name: release

# Publie la version de Cargo.toml : étiquette vX.Y.Z, release GitHub avec
# l'APK public (clé de test, rapports de plantage actifs) et l'entrée du
# CHANGELOG. L'APK testeur (-t.apk), qui envoie ses données d'usage au
# service de collecte (docs/COLLECTE.md), n'est **jamais** sur GitHub : il
# est déposé dans le stockage R2 du service, qui le sert aux seuls APK
# testeur (clé d'envoi) et au propriétaire (/v1/admin/apk), qui le remet aux
# testeurs. Pas d'artefact : ceux d'un dépôt public sont téléchargeables par
# tout compte GitHub.
# De lui-même quand une fusion dans main monte la version, **une fois toute
# la CI android verte sur ce commit, émulateur compris** (les appareils
# proposent la version au lancement, voir AppUpdater : rien ne part sans
# avoir passé l'émulateur). Aussi à la main : Actions › release › Run
# workflow (branche main), sans attendre la CI. Une version déjà publiée
# n'est pas republiée.
on:
  workflow_run:
    workflows: [android]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deux fusions rapprochées : une publication après l'autre.
concurrency:
  group: release
  cancel-in-progress: false

# Commit publié : celui que la CI android a validé (pour un lancement à la
# main, la tête de la branche).
env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    # CI android réussie sur un push dans main, ou lancement à la main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Version
        id: version
        run: |
          v=$(sed -nE 's/^version = "([0-9.]+)"/\1/p' Cargo.toml | head -1)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          # Dernière version publiée (étiquettes vX.Y.Z).
          last=$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed -nE 's|.*refs/tags/v([0-9.]+)$|\1|p' | sort -V | tail -1)
          # Déjà publiée, ou plus ancienne que la dernière : deux CI de main
          # peuvent finir dans le désordre, on ne revient jamais en arrière.
          if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$v" "$last" | sort -V | tail -1)" = "$last" ]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              echo "v$v n'est pas plus récente que v$last, déjà publiée : monter la version d'abord."; exit 1
            fi
            # Pas de nouvelle version dans ce commit : rien à publier.
            echo "v$v pas plus récente que v$last : rien à faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - name: Notes
        run: |
          v="${{ needs.version.outputs.name }}"
          # Entrée du CHANGELOG de cette version (jusqu'à la suivante).
          awk -v v="$v" '$0 ~ "^## "v" " {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          printf '\n---\nHey Stream est uniquement un lecteur : il ne fournit aucun contenu. APK signé avec la clé de test publique (voir android/README.md).\n' >> notes.md
      # Mêmes outils que la CI android ; reprend son cache (lecture seule).
      - uses: ./.github/actions/android-rust
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
          cache-key: android-arm
      - name: APK
        working-directory: android
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
        run: |
          ./gradlew --console=plain :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "../hey-stream-${{ needs.version.outputs.name }}.apk"
      - name: APK testeur
        working-directory: android
        env:
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_URL }}
          TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Sans service de collecte configuré, pas d'APK testeur.
          for name in TELEMETRY_URL TELEMETRY_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "$name absent : pas d'APK testeur (voir docs/COLLECTE.md)."
              exit 0
            fi
          done
          v="${{ needs.version.outputs.name }}"
          ./gradlew --console=plain -Pheystream.testeur=true :app:assembleRelease
          apk="../hey-stream-$v-t.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # L'APK d'abord, puis la fiche qui le désigne.
          npx --yes wrangler@4 r2 object put "hey-stream-donnees-eu/apk/hey-stream-$v-t.apk" \
            --file "$apk" --content-type application/vnd.android.package-archive --remote
          jq -n --arg version "$v" --rawfile notes ../notes.md \
            --arg file "apk/hey-stream-$v-t.apk" \
            --argjson size "$(stat -c %s "$apk")" \
            --arg sha256 "$(sha256sum "$apk" | cut -d' ' -f1)" \
            '{version: $version, notes: $notes, size: $size, sha256: $sha256, file: $file}' > latest.json
          npx --yes wrangler@4 r2 object put hey-stream-donnees-eu/apk/latest.json \
            --file latest.json --content-type application/json --remote
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.version.outputs.name }}"
          gh release create "v$v" "hey-stream-$v.apk" \
            --target "$SHA" --title "Hey Stream $v" \
            --notes-file notes.md --prerelease
