name: android-rust
description: >-
  Rust (cibles Android), cache cargo, Java 21, Gradle, NDK et cargo-ndk.
  Une seule définition pour la CI android et la release : la release se
  construit avec les mêmes outils que la CI qui l'a validée.

inputs:
  targets:
    description: Cibles Rust (ex. « aarch64-linux-android, armv7-linux-androideabi »).
    required: true
  components:
    description: Composants rustup en plus (ex. « clippy »).
    default: ""
  cache-key:
    description: Clé du cache cargo, partagée entre les jobs qui compilent pareil.
    required: true
  save-cache:
    description: « true » pour écrire le cache (main seulement, sinon il déborde).
    default: "false"
  ndk-version:
    description: Version du NDK (la même que ndkVersion dans android/app/build.gradle.kts).
    default: "28.2.13676358"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ inputs.save-cache }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v4
    - name: NDK
      shell: bash
      env:
        NDK_VERSION: ${{ inputs.ndk-version }}
      # Ici bash tourne avec -o pipefail : « yes » finit toujours sur un tube
      # fermé (SIGPIPE), ce qui ne doit pas faire échouer l'installation.
      run: |
        { yes || true; } | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
    # Binaire précompilé : pas de compilation de cargo-ndk à chaque fois.
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-ndk@4.1.2
