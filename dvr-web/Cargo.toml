[package]
name = "heystream-dvr"
version.workspace = true
license.workspace = true
publish = false
edition = "2024"
description = "Appli web locale d'enregistrement DVR (moteur xtream-core)"

[dependencies]
xtream-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
